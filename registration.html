<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightpink;
        }

        .container {
            width: 500px;
            margin: 30px auto;
            background-color: rgb(26, 134, 174);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
            color: rgb(164, 56, 112);
        }

        label {
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        textarea {
            resize: none;
        }

        .gender input {
            width: auto;
            margin-right: 5px;
        }

        .gender label {
            font-weight: normal;
            margin-right: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background-color: darkgreen;
        }

        p {
            text-align: center;
        }

        a {
            text-decoration: none;
            color: blue;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Registration Form</h2>

    <form>

        <label>Student ID</label>
        <input type="text" placeholder="Enter Student ID" required>

        <label>Full Name</label>
        <input type="text" placeholder="Enter Full Name" required>

        <label>Father's Name</label>
        <input type="text" placeholder="Enter Father's Name" required>

        <label>Mother's Name</label>
        <input type="text" placeholder="Enter Mother's Name" required>

        <label>Email Address</label>
        <input type="email" placeholder="Enter Email" required>

        <label>Phone Number</label>
        <input type="tel" placeholder="Enter Phone Number" required>

        <label>Date of Birth</label>
        <input type="date" required>

        <label>Gender</label>

        <div class="gender">
            <input type="radio" name="gender"> Male

            <input type="radio" name="gender"> Female

            <input type="radio" name="gender"> Other
        </div>

        <br>

        <label>Course</label>
        <select required>
            <option value="">Select Course</option>
            <option>B.Tech</option>
            <option>B.Sc</option>
            <option>B.Com</option>
            <option>BCA</option>
            <option>M.Tech</option>
            <option>MCA</option>
            <option>MBA</option>
        </select>

        <label>Branch / Department</label>
        <select required>
            <option value="">Select Branch</option>
            <option>Computer Science and Engineering</option>
            <option>Information Technology</option>
            <option>Electronics and Communication</option>
            <option>Electrical Engineering</option>
            <option>Mechanical Engineering</option>
            <option>Civil Engineering</option>
        </select>

        <label>Year of Study</label>
        <select required>
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
        </select>

        <label>Address</label>
        <textarea rows="3" placeholder="Enter Address"></textarea>

        <label>City</label>
        <input type="text" placeholder="Enter City">

        <label>State</label>
        <input type="text" placeholder="Enter State">

        <label>Country</label>
        <input type="text" placeholder="Enter Country">

        

        <label>Password</label>
        <input type="password" placeholder="Enter Password" required>

        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm Password" required>

        <button type="submit">Register</button>

        <p>
            Already have an account?
            <a href="#">Login Here</a>
        </p>

    </form>

</div>

</body>
</html>
